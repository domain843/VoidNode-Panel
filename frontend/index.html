<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoidNode // Control Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#030712] text-cyan-400 font-mono min-h-screen p-6 md:p-12">
    <div class="max-w-4xl mx-auto border border-cyan-500/30 bg-gray-900/40 backdrop-blur-md p-6 rounded-2xl shadow-[0_0_30px_rgba(6,182,212,0.1)]">
        
        <!-- Header -->
        <div class="flex justify-between items-center border-b border-cyan-500/30 pb-4 mb-6">
            <h1 class="text-xl font-bold tracking-widest text-cyan-200">VOIDNODE // CONTROL_CORE</h1>
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-cyan-950 text-cyan-400 border border-cyan-500/40">
                SECURE_SSL
            </span>
        </div>
        
        <!-- Metrics Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="border border-cyan-500/20 bg-black/40 p-4 rounded-xl">
                <p class="text-xs text-gray-500 mb-1">CPU LOAD</p>
                <p id="cpu" class="text-2xl font-bold text-cyan-300">--%</p>
            </div>
            <div class="border border-cyan-500/20 bg-black/40 p-4 rounded-xl">
                <p class="text-xs text-gray-500 mb-1">MEMORY ALLOCATION</p>
                <p id="ram" class="text-xl font-bold text-cyan-300">-- / -- MB</p>
            </div>
            <div class="border border-cyan-500/20 bg-black/40 p-4 rounded-xl">
                <p class="text-xs text-gray-500 mb-1">STORAGE CAPACITY</p>
                <p id="disk" class="text-2xl font-bold text-cyan-300">--%</p>
            </div>
        </div>
    </div>

    <script>
        async function fetchStats() {
            try {
                let res = await fetch('/api/stats');
                let data = await res.json();
                document.getElementById('cpu').innerText = data.cpu + '%';
                document.getElementById('ram').innerText = `${data.ram_used} / ${data.ram_total} MB`;
                document.getElementById('disk').innerText = data.disk_percent + '%';
            } catch(e) { console.error('Error fetching metrics', e); }
        }
        setInterval(fetchStats, 2000);
        fetchStats();
    </script>
</body>
</html>
